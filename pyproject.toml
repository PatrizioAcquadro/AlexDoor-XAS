# Isaac, Alex, PyTorch, Warp and CUDA are supplied by the workstation runtime.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alexdoor-xas"
version = "0.1.0"
description = "Cross-action-space learning for humanoid articulated-object manipulation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Patrizio Acquadro", email = "pacquadr@purdue.edu" }]
dependencies = [
    "numpy>=1.24",
    "scipy",
    "h5py",
    "Pillow",
    "opencv-python-headless>=4.10",
    "trimesh",
    "gymnasium",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff==0.15.3",
    "build>=1.2",
]
diffusion = ["diffusers>=0.39,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/alexdoor_xas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/unit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

# Isaac, Alex, PyTorch, Warp and CUDA are supplied by the workstation runtime.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alexdoor-xas"
version = "0.1.0"
description = "Cross-action-space learning for humanoid articulated-object manipulation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Patrizio Acquadro", email = "pacquadr@purdue.edu" }]
dependencies = [
    "numpy>=1.24",
    "scipy",
    "h5py",
    "Pillow",
    "PyYAML",
    "trimesh",
    "gymnasium",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]
diffusion = ["diffusers>=0.39,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/alexdoor_xas"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
